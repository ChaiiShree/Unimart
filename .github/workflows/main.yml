name: Push Frontend to Another Repository

on:
  push:
    paths:
      - 'frontend/**'
    branches:
      - main
  workflow_dispatch:  # Allows the workflow to be manually triggered

jobs:
  push-to-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup and Push Frontend
        run: |
          cd frontend
          git init
          git checkout -b main
          
          # Configure Git with credentials directly
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git remote add origin https://unipalmark:${{ secrets.GIT_PASS }}@github.com/unipalmark/unipal-frontend.git
          git add .
          git commit -m "Update frontend"
          git push origin main --force
        env:
          GIT_PASS: ${{ secrets.GIT_PASS }}
